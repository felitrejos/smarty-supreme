name: SmartySupreme
options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: WXKM9YZDXT
    CODE_SIGN_STYLE: Automatic
packages:
  SmartyCore:
    path: SmartyCore
targets:
  SmartyPaddle:
    type: application
    platform: iOS
    sources: [Apps/SmartyPaddle, Apps/Shared, Apps/Link, Apps/Style, Apps/Icon]
    dependencies:
      - package: SmartyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartysupreme.paddle
        INFOPLIST_FILE: Apps/SmartyPaddle/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Smarty Paddle
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
    scheme: {}
  SmartyRecorder:
    type: application
    platform: iOS
    sources: [Apps/SmartyRecorder, Apps/Shared]
    dependencies:
      - package: SmartyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartysupreme.recorder
        INFOPLIST_KEY_CFBundleDisplayName: Smarty Recorder
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_FILE: Apps/SmartyRecorder/Info.plist
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: "1"
    scheme: {}
  SmartyHost:
    type: application
    platform: macOS
    sources:
      - Apps/SmartyHost
      - Apps/Link
      - Apps/Style
      - Apps/Icon
      - path: Assets/Lighting
        buildPhase: resources
        excludes: ["*.md"]
      - path: Assets/Models
        type: folder
        buildPhase: resources
      - path: Assets/Textures
        type: folder
        buildPhase: resources
      - path: Assets/Voice
        type: folder
        buildPhase: resources
      - path: Assets/Crowd
        type: folder
        buildPhase: resources
      - path: Assets/Sounds
        buildPhase: resources
        excludes: ["*.md"]
    dependencies:
      - package: SmartyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartysupreme.host
        PRODUCT_NAME: Smarty Supreme
        PRODUCT_MODULE_NAME: SmartyHost
        INFOPLIST_FILE: Apps/SmartyHost/Info.plist
        ENABLE_INCOMING_NETWORK_CONNECTIONS: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        INFOPLIST_KEY_CFBundleDisplayName: Smarty Supreme
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports-games
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    scheme: {}
